name: Update Spack Package Interface
on:
  workflow_dispatch:
  schedule:
    - cron:  '0 5 * * *'

jobs:
  extraction:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    - name: Clone development branch of spack
      run: |
        git clone https://github.com/spack/spack /opt/spack
        git -C /opt/spack reset --hard e2c5745352ebc0465ebc8d548e60759f05173c83  # Jul 28, 2026
    - name: Run update script
      run: |
         export PATH=/opt/spack/bin:$PATH
         spack python generate_packages.py

    - name: Push Results
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@users.noreply.github.com"
        git add -f data
        git commit -m "Automated push with new spackages $(date '+%Y-%m-%d')" || exit 0
        git push --force origin HEAD:gh-pages
